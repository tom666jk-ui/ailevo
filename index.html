<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>艾灵坞 ailevo - 交流社区</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
:root{
  --main:#2563eb;
  --red:#f56c6c;
  --gray:#909399;
  --bg:#f5f7fa;
  --card:#ffffff;
  --border:#eee;
}
body{background:var(--bg);padding:16px}
.container{max-width:980px;margin:0 auto;background:var(--card);border-radius:14px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.06)}
.header{text-align:center;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.logo{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,var(--main),#60a5fa);
  color:#fff;
  font-size:28px;font-weight:bold;
  line-height:72px;margin:0 auto 10px;
}
.header h1{font-size:28px;color:#192946}
.header span{color:var(--main);font-weight:bold}
.header p{color:var(--gray);font-size:14px;margin-top:6px}
.visit-info{text-align:center;font-size:13px;color:var(--gray);margin-bottom:16px;}

.publish-box{border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px;background:#fafafa}
.upload-group{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.upload-btn{padding:8px 12px;background:#f1f5ff;border:1px solid #d0e0ff;border-radius:6px;cursor:pointer;font-size:13px;}
.upload-btn input{display:none;}

/* 表情面板 */
.emoji-panel{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#fff;border:1px solid #eee;border-radius:8px;margin-bottom:12px;}
.emoji{font-size:18px;cursor:pointer;padding:4px;border-radius:4px;}
.emoji:hover{background:#f0f7ff;}
.toggle-emoji{margin-bottom:10px;padding:6px 10px;background:#fff;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:13px;}

.post-card{border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
.post-card.top-post{border:1px solid var(--red);background:#fff6f6}
.top-tag{display:inline-block;background:var(--red);color:#fff;font-size:12px;padding:2px 8px;border-radius:4px;margin-right:8px}

.avatar{width:40px;height:40px;border-radius:50%;background:var(--main);color:#fff;text-align:center;line-height:40px;font-weight:bold;display:inline-block;margin-right:10px}
.post-head{display:flex;align-items:flex-start;margin-bottom:10px}

/* 媒体展示 */
.post-img{max-width:180px;max-height:180px;margin:8px 10px 8px 0;border-radius:8px;object-fit:cover;cursor:pointer;}
.post-video{max-width:320px;margin:10px 0;border-radius:8px;}
.file-item{background:#eef5ff;padding:8px 12px;border-radius:6px;margin:6px 0;display:inline-block;}
.file-item a{color:#2563eb;text-decoration:none;font-size:14px;}

.reply-wrap{margin-top:16px;padding-top:16px;border-top:1px dashed var(--border)}
.reply-item{padding:12px;margin-left:15px;border-left:2px solid #c0d8f5;margin-bottom:10px;background:#f9fbff;border-radius:0 6px 6px 0}
.reply2-item{margin-left:40px;border-left-color:#b2d9b2}

input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px;font-size:14px;outline:none}
input:focus,textarea:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
button{padding:9px 16px;border:none;border-radius:8px;background:var(--main);color:#fff;cursor:pointer}
.time-text{font-size:12px;color:var(--gray);margin-top:4px}
.hide{display:none}

.footer{margin-top:40px;text-align:center;font-size:12px;color:var(--gray);padding-top:20px;border-top:1px solid var(--border);}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">艾</div>
        <h1>艾灵坞 <span>ailevo</span></h1>
        <p>Ailevo 专属交流社区 · 文明发言</p>
    </div>

    <div class="visit-info">社区累计访问：<span id="visitCount">0</span> 次</div>

    <div id="maintainTip" class="hide" style="text-align:center;color:var(--red);padding:30px;">
        <h3>🚧 社区维护中，暂时无法发帖与回复</h3>
    </div>

    <!-- 发帖区域 -->
    <div class="publish-box" id="publishBox">
        <input type="text" id="postTitle" placeholder="📌 输入主题标题">
        
        <div class="toggle-emoji" onclick="toggleEmoji('post')">😀 表情</div>
        <div id="emojiPost" class="emoji-panel hide"></div>
        
        <textarea id="postContent" rows="4" placeholder="✍️ 输入帖子内容"></textarea>

        <div class="upload-group">
            <label class="upload-btn">🖼️ 上传图片 <input type="file" id="uploadImg" accept="image/*" multiple></label>
            <label class="upload-btn">🎥 上传视频 <input type="file" id="uploadVideo" accept="video/*"></label>
            <label class="upload-btn">📄 上传文档 <input type="file" id="uploadFile" multiple></label>
        </div>

        <div id="previewArea" style="margin-top:10px;"></div>
        <button onclick="publishPost()">发布主题</button>
    </div>

    <div id="postList"></div>

    <div class="footer">
        <p>© 2025-2026 艾灵坞 ailevo 版权所有</p>
        <p>备案号：<a href="https://beian.miit.gov.cn" target="_blank" style="color:var(--gray);text-decoration:none">粤ICP备18122527号</a></p>
        <p>文明社区 · 违规内容管理员定时清理</p>
    </div>
</div>

<script>
// ==================== 配置 ====================
const CONFIG = {
    storageKey: "ailevo_community_v4",
    visitKey: "ailevo_visit_count",
    floodInterval: 5000,
    maxTextLen: 2000
};
let lastPostTime = 0;
let tempMedia = {img:[], video:"", file:[]};

// ==================== 访问统计 ====================
function countVisit(){
    let num = Number(localStorage.getItem(CONFIG.visitKey) || 0);
    num++; localStorage.setItem(CONFIG.visitKey, num);
    document.getElementById("visitCount").innerText = num;
}
countVisit();

// ==================== 微信风格微表情列表 ====================
const EMOJIS = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','😷','🤒','🤕','🤢','🤮','🤧','😇','🥴','🥰','😈','👿','👹','👺','💀','👻','👽','🤖','💩','😺','😸','😹','😻','😼','😽','🙀','😿','😾','🙈','🙉','🙊','💌','💘','💝','💖','💗','💓','💞','💕','💟','💔','🧡','💛','💚','💙','💜','🤎','🖤','🤍','✋','🤚','🖐️','🖖','🤟','🤘','🤙','👍','👎','✊','✌️','🤞','🤟','🤝','🙏','💪','👏'];

// 渲染表情
function renderEmoji(targetId){
    let box = document.getElementById(targetId);
    let html = '';
    EMOJIS.forEach(e=>{
        html+=`<span class="emoji" onclick="insertEmoji('${targetId}','${e}')">${e}</span>`;
    });
    box.innerHTML = html;
}

// 显示/隐藏表情
function toggleEmoji(prefix){
    let el = document.getElementById("emoji"+prefix.toUpperCase());
    el.classList.toggle("hide");
}

// 插入表情到输入框 —— 【修复完成】
function insertEmoji(targetId, emoji){
    let input;
    if(targetId === "emojiPost"){
        input = document.getElementById("postContent");
    } else if(targetId.startsWith("emojiReply_")){
        let pid = targetId.replace("emojiReply_","");
        input = document.getElementById("reply_"+pid);
    } else if(targetId.startsWith("emojiReply2_")){
        let rid = targetId.replace("emojiReply2_","");
        input = document.getElementById("reply2_"+rid);
    }
    if(input){
        input.value += emoji;
    }
}

// ==================== 上传图片预览 ====================
document.getElementById("uploadImg").addEventListener("change",function(e){
    let files = e.target.files;
    for(let f of files){
        let url = URL.createObjectURL(f);
        tempMedia.img.push({name:f.name, url:url});
    }
    showPreview();
});

// 上传视频
document.getElementById("uploadVideo").addEventListener("change",function(e){
    let f = e.target.files[0];
    if(f){
        tempMedia.video = {name:f.name, url:URL.createObjectURL(f)};
        showPreview();
    }
});

// 上传文档
document.getElementById("uploadFile").addEventListener("change",function(e){
    let files = e.target.files;
    for(let f of files){
        tempMedia.file.push({name:f.name, url:URL.createObjectURL(f), size:(f.size/1024/1024).toFixed(2)+"MB"});
    }
    showPreview();
});

// 预览
function showPreview(){
    let p = document.getElementById("previewArea");
    let h = "";
    tempMedia.img.forEach(i=>{h+=`<img src="${i.url}" class="post-img">`;});
    if(tempMedia.video){h+=`<video src="${tempMedia.video.url}" class="post-video" controls></video>`;}
    tempMedia.file.forEach(f=>{h+=`<div class="file-item"><a href="${f.url}" download="${f.name}">📄 ${f.name} (${f.size})</a></div>`;});
    p.innerHTML = h;
}

// ==================== 数据 ====================
function getLocalData(){
    try{
        let d = localStorage.getItem(CONFIG.storageKey);
        return d ? JSON.parse(d) : {posts:[],banList:[],siteSwitch:"on"};
    }catch(e){
        return {posts:[],banList:[],siteSwitch:"on"};
    }
}
function saveLocalData(d){
    localStorage.setItem(CONFIG.storageKey, JSON.stringify(d));
}

// ==================== 安全过滤 ====================
function safeEscape(s){
    return String(s).replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function checkContent(t){return t && t.trim()!="" && t.length <= CONFIG.maxTextLen}
function checkFlood(){
    let now = Date.now();
    if(now-lastPostTime < CONFIG.floodInterval) return false;
    lastPostTime = now; return true;
}

// ==================== 发布帖子 ====================
function publishPost(){
    let d = getLocalData();
    if(d.siteSwitch === "off"){alert("维护中无法发帖");return}
    if(!checkFlood()){alert("操作频繁，请稍后再试");return}

    let title = document.getElementById("postTitle").value.trim();
    let content = document.getElementById("postContent").value.trim();
    if(!checkContent(title) || !checkContent(content)){alert("标题/内容不能为空");return}

    let post = {
        id:"p_"+Date.now(), title:safeEscape(title), content:safeEscape(content),
        time:new Date().toLocaleString(), isTop:false,
        img:tempMedia.img, video:tempMedia.video, file:tempMedia.file,
        replyList:[]
    };

    d.posts.unshift(post);
    saveLocalData(d);

    // 清空
    document.getElementById("postTitle").value = "";
    document.getElementById("postContent").value = "";
    tempMedia = {img:[], video:"", file:[]};
    document.getElementById("previewArea").innerHTML = "";
    renderPage();
}

// ==================== 回复 ====================
function addReply(postId){
    let d = getLocalData();
    if(d.siteSwitch === "off"){alert("维护中无法回复");return}
    if(!checkFlood()){alert("操作频繁");return}

    let v = document.getElementById("reply_"+postId).value.trim();
    if(!checkContent(v)){alert("回复不能为空");return}

    let p = d.posts.find(x=>x.id === postId);
    if(!p) return;

    p.replyList.push({
        id:"r_"+Date.now(), content:safeEscape(v),
        time:new Date().toLocaleString(), reply2:[]
    });
    saveLocalData(d);
    document.getElementById("reply_"+postId).value = "";
    renderPage();
}

// 楼中楼
function addReply2(pid,rid){
    let d = getLocalData();
    if(d.siteSwitch === "off") return;
    let v = document.getElementById("reply2_"+rid).value.trim();
    if(!checkContent(v)) return;
    let p = d.posts.find(x=>x.id === pid);
    let r = p?.replyList.find(x=>x.id === rid);
    if(!r) return;
    r.reply2.push({content:safeEscape(v), time:new Date().toLocaleString()});
    saveLocalData(d);
    renderPage();
}

// ==================== 页面渲染 ====================
function renderPage(){
    let d = getLocalData();
    let tip = document.getElementById("maintainTip");
    let box = document.getElementById("publishBox");
    d.siteSwitch === "off" ? (tip.classList.remove("hide"),box.classList.add("hide")) : (tip.classList.add("hide"),box.classList.remove("hide"));

    let top = d.posts.filter(x=>x.isTop);
    let normal = d.posts.filter(x=>!x.isTop);
    let all = [...top,...normal];
    let html = "";

    all.forEach(post=>{
        html+=`
        <div class="post-card ${post.isTop?'top-post':''}">
            <div class="post-head">
                <div class="avatar">艾</div>
                <div>${post.isTop?'<span class="top-tag">置顶</span>':''}
                <h3>${post.title}</h3><div class="time-text">${post.time}</div></div>
            </div>
            <div class="content">${post.content}</div>
        `;
        // 图片
        if(post.img && post.img.length>0){
            post.img.forEach(i=>{
                html+=`<img src="${i.url}" class="post-img" onclick="window.open(this.src)">`;
            });
        }
        // 视频
        if(post.video){
            html+=`<video src="${post.video.url}" class="post-video" controls></video>`;
        }
        // 文档
        if(post.file && post.file.length>0){
            post.file.forEach(f=>{
                html+=`<div class="file-item"><a href="${f.url}" download="${f.name}">📄 ${f.name} (${f.size})</a></div>`;
            });
        }

        // 回复框 + 表情
        html+=`
            <div class="reply-wrap">
                <div class="toggle-emoji" onclick="toggleEmoji('reply_${post.id}')">😀 表情</div>
                <div id="emojiReply_${post.id}" class="emoji-panel hide"></div>
                <textarea id="reply_${post.id}" rows="2" placeholder="回复内容"></textarea>
                <button onclick="addReply('${post.id}')">提交回复</button>
        `;
        post.replyList.forEach(r1=>{
            html+=`
            <div class="reply-item">
                <div>${r1.content}</div><div class="time-text">${r1.time}</div>
                <div class="toggle-emoji" onclick="toggleEmoji('reply2_${r1.id}')">😀 回复表情</div>
                <div id="emojiReply2_${r1.id}" class="emoji-panel hide"></div>
                <textarea id="reply2_${r1.id}" rows="1" placeholder="楼中楼回复"></textarea>
                <button onclick="addReply2('${post.id}','${r1.id}')">回复</button>
            `;
            r1.reply2.forEach(r2=>{
                html+=`<div class="reply-item reply2-item"><div>${r2.content}</div><div class="time-text">${r2.time}</div></div>`;
            });
            html+="</div>";
        });
        html+="</div></div>";
    });
    document.getElementById("postList").innerHTML = html;

    // 为所有回复渲染表情
    all.forEach(post=>{
        renderEmoji("emojiReply_"+post.id);
        post.replyList.forEach(r=>{
            renderEmoji("emojiReply2_"+r.id);
        });
    });
}

window.onload = function(){
    renderEmoji("emojiPost");
    renderPage();
};
</script>
</body>
</html>
